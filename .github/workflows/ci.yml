name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify repo snapshots are up to date
        run: |
          node ops/tools/generate_repo_snapshot.mjs
          if ! git diff --exit-code -- ops/snapshots; then
            echo "Snapshot artifacts out of date. Run: node ops/tools/generate_repo_snapshot.mjs and commit ops/snapshots/*"
            exit 1
          fi

      - name: Typecheck + build
        run: pnpm -r build

      - name: Unit tests
        run: pnpm --filter @emc/api test
