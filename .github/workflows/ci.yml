name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate repo snapshots
        run: node ops/tools/generate_repo_snapshot.mjs

      - name: Verify snapshots are committed
        run: |
          git diff --exit-code -- ops/snapshots || (echo "Snapshot artifacts out of date. Run: node ops/tools/generate_repo_snapshot.mjs and commit ops/snapshots/*" && exit 1)

      - name: Typecheck + build
        run: pnpm -r build

      - name: Unit tests
        run: pnpm --filter @emc/api test
