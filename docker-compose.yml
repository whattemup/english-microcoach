services:
  postgres:
    image: postgres:16-alpine
    container_name: emc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emc
      POSTGRES_USER: emc
      POSTGRES_PASSWORD: emc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
